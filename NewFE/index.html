<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindConnect - Kết nối chuyên gia</title>
  <link rel="stylesheet" href="../NewFE/css/style.css" />
</head>
<body>

<!-- 🔹 Navbar -->
<header class="navbar">
  <div class="container">
    <div class="logo">MindConnect</div>
    <nav class="menu">
      <a href="index.html">Trang chủ</a>
      <a href="html/experts.html">Chuyên gia</a>
      <a href="html/contact.html">Liên hệ</a>
      <select id="roleSelect" style="margin-left: 20px; padding: 6px 10px; border-radius: 5px;">
        <option value="">-- Chọn vai trò --</option>
        <option value="user">Người dùng</option>
        <option value="admin">Admin</option>
      </select>
    </nav>    
  </div>
</header>

<main class="expert-section">
  <div class="container">

    <!-- 🔹 Danh sách chuyên gia -->
    <h1 class="section-title" style="margin-top: 20px;">Danh sách chuyên gia</h1>
    <div id="expertList" class="expert-grid">
      <!-- Render chuyên gia bằng JS -->
    </div>

    <!-- 🔹 Đăng ký trở thành chuyên gia (chỉ hiện khi role là user) -->
    <div id="becomeExpertSection" style="text-align:center; margin-top:40px; display:none;">
      <button onclick="openBecomeExpertForm()" style="padding:10px 20px; background-color: var(--primary-color); color:white; border:none; border-radius:6px;">Đăng ký trở thành chuyên gia</button>
    </div>

  </div>
</main>

<!-- 🔹 Popup Form đăng ký trở thành chuyên gia -->
<div id="becomeExpertModal" class="popup-overlay" style="display:none;">
  <div class="popup-box" style="max-width:500px;">
    <h2>Đăng ký trở thành chuyên gia</h2>
    <form id="becomeExpertForm">
      <div style="text-align:center; margin-bottom:10px;">
        <div id="previewNewExpertImage" style="width:100px; height:100px; margin:auto; background:#eee; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;">
          <span style="font-size:12px; color:#999;">Chưa có ảnh</span>
        </div>
        <input type="file" id="newExpertImage" accept="image/*" style="margin-top:10px;">
      </div>
      <input type="text" id="newExpertName" placeholder="Tên chuyên gia*" required style="margin-bottom:10px; width:100%;">
      <input type="text" id="newExpertSpecialty" placeholder="Chuyên môn*" required style="margin-bottom:10px; width:100%;">
      <input type="text" id="newExpertExperience" placeholder="Kinh nghiệm*" required style="margin-bottom:10px; width:100%;">
      <input type="text" id="newExpertPrice" placeholder="Giá tư vấn*" required style="margin-bottom:10px; width:100%;">
      <button type="submit" style="margin-top:10px;">Gửi yêu cầu</button>
      <button type="button" onclick="closeBecomeExpertForm()" style="margin-top:10px;">Huỷ</button>
    </form>
  </div>
</div>

<!-- 🔹 Load file JS -->
<script src="../js/user.js"></script>

</body>
</html>
