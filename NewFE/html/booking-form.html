<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lịch hẹn</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- 🔹 Navbar -->
<header class="navbar">
  <div class="container">
    <div class="logo">MindConnect</div>
    <nav class="menu">
      <a href="../index.html">Trang chủ</a>
      <a href="experts.html">Chuyên gia</a>
      <a href="contact.html">Liên hệ</a>
      <select id="roleSelect" style="margin-left: 20px; padding: 6px 10px; border-radius: 5px;">
        <option value="">-- Chọn vai trò --</option>
        <option value="user">Người dùng</option>
        <option value="admin">Admin</option>
      </select>
    </nav>
  </div>
</header>

<!-- 🔹 Form đặt lịch -->
<section class="booking-section">
  <div class="container">
    <h2>Đặt lịch hẹn</h2>
    <form id="formBooking" onsubmit="return validateForm()">
      <label for="expert">Chọn chuyên gia*</label>
      <select id="expert" required>
        <option value="">-- Chọn chuyên gia --</option>
        <option value="Nguyễn Thị Mai">Nguyễn Thị Mai - Tâm lý học hành vi</option>
        <option value="Trần Minh Tú">Trần Minh Tú - Tư vấn tâm lý học đường</option>
        <option value="Phạm Hồng Sơn">Phạm Hồng Sơn - Tâm lý học phát triển</option>
      </select>

      <label for="name">Họ tên*</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email*</label>
      <input type="email" id="email" name="email" required />

      <label for="date">Ngày hẹn*</label>
      <input type="date" id="date" name="date" required />

      <label for="slot">Chọn giờ hẹn*</label>
      <select id="slot" required>
        <option value="">-- Chọn giờ --</option>
        <option value="09:00">09:00</option>
        <option value="10:30">10:30</option>
        <option value="14:00">14:00</option>
        <option value="15:30">15:30</option>
        <option value="17:00">17:00</option>
      </select>

      <label for="note">Ghi chú</label>
      <textarea id="note" name="note" rows="4" placeholder="Ghi chú thêm (tuỳ chọn)"></textarea>

      <button type="submit">Xác nhận đặt lịch</button>
    </form>
  </div>
</section>

<!-- 🔹 Popup thanh toán -->
<div id="paymentModal" class="popup-overlay" style="display:none;">
  <div class="popup-box" style="max-width:400px;">
    <h2>Xác nhận thanh toán</h2>
    <p>Bạn cần thanh toán trước để xác nhận lịch hẹn.</p>
    <div style="margin-top:20px; display:flex; justify-content:space-around;">
      <button onclick="confirmPayment()" style="padding:10px 20px; background-color:var(--primary-color); color:white; border:none; border-radius:6px;">Thanh toán</button>
      <button onclick="cancelPayment()" style="padding:10px 20px; background-color:var(--secondary-color); color:white; border:none; border-radius:6px;">Huỷ</button>
    </div>
  </div>
</div>

<!-- 🔹 Popup thông báo chung -->
<div id="popup" class="popup-overlay" style="display:none;">
  <div class="popup-box">
    <p id="popup-message">Thông báo</p>
    <button onclick="closePopup()">Đóng</button>
  </div>
</div>

<!-- 🔹 Gắn file JS riêng -->
<script src="../js/booking-form.js"></script>

</body>
</html>
