<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liên hệ với chúng tôi</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <!-- 🔹 Navbar -->
  <header class="navbar">
    <div class="container">
      <div class="logo">MindConnect</div>
      <nav class="menu">
        <a href="../index.html">Trang chủ</a>
        <a href="experts.html">Chuyên gia</a>
        <a href="contact.html">Liên hệ</a>
        <select id="roleSelect" style="margin-left: 20px; padding: 6px 10px; border-radius: 5px;">
          <option value="">-- Chọn vai trò --</option>
          <option value="user">Người dùng</option>
          <option value="admin">Admin</option>
        </select>
      </nav>
    </div>
  </header>  
  

  <!-- 🔹 Form liên hệ -->
  <section class="booking-section">
    <div class="container">
      <h2>Liên hệ với chúng tôi</h2>
      <form id="contactForm" onsubmit="return validateContactForm()">
        <label for="name">Họ tên*</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email*</label>
        <input type="email" id="email" name="email" required />

        <label for="subject">Chủ đề*</label>
        <input type="text" id="subject" name="subject" required />

        <label for="message">Nội dung*</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Gửi liên hệ</button>
      </form>
    </div>
  </section>

  <!-- 🗺️ Google Map -->
  <section style="padding: 0 0 60px 0; text-align: center;">
    <h2 style="color: var(--secondary-color); margin-bottom: 20px;">Vị trí văn phòng</h2>
    <div style="width: 100%; max-width: 800px; margin: auto;">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.2897295196377!2d106.68224931532552!3d10.789253261896027!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x317528d3f164ec21%3A0x3aa7640ff63e5b36!2zMTIzIMSQLiBNw6FjIFRo4buLbmcsIFBoxrDhu51uZyA3LCBRdeG7kWMgMywgUXXhuq1uIDMsIEjDoCBO4buZaSBNw6AgQ2jDrSBNaW5oLCBWaeG7h3QgTmFt!5e0!3m2!1svi!2s!4v1680508712083!5m2!1svi!2s" 
        width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy">
      </iframe>
    </div>
  </section>

  <!-- 🔻 Footer -->
  <footer style="background-color: var(--primary-color); color: white; padding: 20px 0; text-align: center;">
    <div class="container">
      <p><strong>MindConnect</strong> – Kết nối tâm lý, lan toả yêu thương</p>
      <p>Email: support@mindconnect.vn | Hotline: 1900 1234</p>
      <p>&copy; 2025 MindConnect. All rights reserved.</p>
    </div>
  </footer>

  <!-- 🔹 Popup modal -->
  <div id="popup" class="popup-overlay">
    <div class="popup-box">
      <p id="popup-message">Cảm ơn bạn đã liên hệ. Chúng tôi sẽ phản hồi sớm nhất có thể.</p>
      <button onclick="closePopup()">Đóng</button>
    </div>
  </div>

  <!-- 🔹 Script -->
  <script>
    function isValidEmail(email) {
      const re = /\S+@\S+\.\S+/;
      return re.test(email);
    }

    function validateContactForm() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !email || !subject || !message) {
        showPopup("Vui lòng điền đầy đủ thông tin.");
        return false;
      }

      if (!isValidEmail(email)) {
        showPopup("Email không hợp lệ.");
        return false;
      }

      showPopup("Cảm ơn bạn đã liên hệ. Chúng tôi sẽ phản hồi sớm nhất có thể.");
      document.getElementById("contactForm").reset();
      return false;
    }

    function showPopup(msg) {
      document.getElementById("popup-message").innerText = msg;
      document.getElementById("popup").style.display = "flex";
    }

    function closePopup() {
      document.getElementById("popup").style.display = "none";
    }
  </script>

  <!-- Xử lí logic chọn vai trò -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const roleSelect = document.getElementById("roleSelect");
  
      // Nếu đã lưu vai trò, tự động chọn
      const savedRole = localStorage.getItem("userRole");
      if (savedRole && roleSelect) {
        roleSelect.value = savedRole;
      }
  
      roleSelect.addEventListener("change", function () {
        const role = roleSelect.value;
        localStorage.setItem("userRole", role); // Lưu vai trò vào localStorage
  
        if (role === "user") {
          alert("Bạn đã chọn vai trò Người dùng.");
          window.location.href = "../index.html";
        } else if (role === "admin") {
          alert("Bạn đã chọn vai trò Admin. Chuyển đến trang quản trị.");
          window.location.href = "admin.html";
        }
      });
    });
  </script>  
  
</body>
</html>
