<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản trị MindConnect</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- 🔹 Navbar -->
<header class="navbar">
  <div class="container">
    <div class="logo">MindConnect Admin</div>
    <nav class="menu">
      <a href="../index.html">Trang chủ</a>
      <select id="roleSelect" style="margin-left: 20px; padding: 6px 10px; border-radius: 5px;">
        <option value="">-- Chọn vai trò --</option>
        <option value="user">Người dùng</option>
        <option value="admin">Admin</option>
      </select>
    </nav>
  </div>
</header>

<main class="expert-section">
  <div class="container">

    <!-- 🔹 Dashboard báo cáo số liệu -->
    <section class="dashboard-section" style="margin-top:40px;">
      <div class="container" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
        <div class="dashboard-card" style="flex: 1; min-width:200px; background: var(--primary-color); color:white; border-radius:10px; padding:20px; text-align:center;">
          <h3>Tổng số chuyên gia</h3>
          <p id="totalExperts" style="font-size:28px; margin-top:10px;">0</p>
        </div>
        <div class="dashboard-card" style="flex: 1; min-width:200px; background: var(--secondary-color); color:white; border-radius:10px; padding:20px; text-align:center;">
          <h3>Tổng số đơn đặt lịch</h3>
          <p id="totalBookings" style="font-size:28px; margin-top:10px;">0</p>
        </div>
      </div>
    </section>

    <!-- 🔹 Quản lý chuyên gia -->
    <h1 class="section-title" style="margin-top:40px;">Quản lý chuyên gia</h1>

    <!-- 🔸 Ô tìm kiếm chuyên gia -->
    <div style="text-align:center; margin-bottom: 20px;">
      <input 
        type="text" 
        id="searchBox" 
        placeholder="Tìm kiếm chuyên gia theo tên..." 
        style="padding: 10px; width: 300px; border-radius: 6px; border: 1px solid #ccc;"
      />
    </div>

    <!-- 🔸 Form Thêm / Cập nhật chuyên gia -->
    <div class="form-wrapper" style="margin-top: 40px; max-width: 900px; margin-left: auto; margin-right: auto;">
      <form id="addExpertForm" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
        <input type="hidden" id="editIndex" value="">
        <div style="flex: 1; min-width: 250px; text-align: center;">
          <div id="imagePreview" style="width: 150px; height: 150px; margin:auto; background-color: #f0f0f0; border: 1px dashed #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <span style="font-size: 12px; color: #999;">Chưa chọn ảnh</span>
          </div>
          <input type="file" id="expertImage" accept="image/*" style="margin-top: 10px;" required />
        </div>

        <div style="flex: 2; min-width: 300px;">
          <label for="expertName">Tên chuyên gia*</label>
          <input type="text" id="expertName" required style="width: 100%; margin-bottom: 10px;">

          <label for="expertSpecialty">Chuyên môn*</label>
          <input type="text" id="expertSpecialty" required style="width: 100%; margin-bottom: 10px;">

          <label for="expertExperience">Kinh nghiệm*</label>
          <input type="text" id="expertExperience" required style="width: 100%; margin-bottom: 10px;">

          <label for="expertPrice">Giá tư vấn*</label>
          <input type="text" id="expertPrice" required style="width: 100%; margin-bottom: 10px;">
        </div>

        <div style="flex-basis: 100%; text-align:center; margin-top:20px;">
          <button type="submit" style="padding:12px 30px; background-color: var(--primary-color); color:white; border:none; font-size:16px; border-radius:6px;">
            Thêm chuyên gia
          </button>
        </div>
      </form>
    </div>

    <!-- 🔸 Bảng chuyên gia -->
    <div style="overflow-x:auto; margin-top: 40px;">
      <table id="expertTable" style="width:100%; border-collapse: collapse;">
        <thead style="background-color: var(--primary-color); color: white;">
          <tr>
            <th>Ảnh</th>
            <th>Tên chuyên gia</th>
            <th>Chuyên môn</th>
            <th>Kinh nghiệm</th>
            <th>Giá</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="expertTableBody">
          <!-- Render bởi JS -->
        </tbody>
      </table>
    </div>

    <!-- 🔸 Phân trang -->
    <div id="pagination" style="text-align:center; margin-top:20px;"></div>

    <!-- 🔹 Quản lý đơn đặt lịch -->
    <h1 class="section-title" style="margin-top:60px;">Quản lý đơn đặt lịch</h1>
    <div style="overflow-x:auto;">
      <table id="bookingTable" style="width:100%; border-collapse: collapse; margin-top: 20px;">
        <thead style="background-color: var(--primary-color); color: white;">
          <tr>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Ngày hẹn</th>
            <th>Giờ hẹn</th>
            <th>Ghi chú</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="bookingTableBody">
          <!-- Render bởi JS -->
        </tbody>
      </table>
    </div>

  </div>
</main>

<!-- 🔹 Load file admin.js -->
<script src="../js/admin.js"></script>

</body>
</html>
