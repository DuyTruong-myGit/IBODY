<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thu nhập Chuyên gia</title>
  <link rel="stylesheet" href="../CSS/earnings-expert.css">
</head>
<body>

  <div class="earnings-container">
    <button class="go-back-btn" onclick="history.back()">Quay lại</button>

    <h1>Thu nhập & Khách hàng</h1>

    <!-- Thông tin tình trạng khám -->
    <div class="info-cards">
      <div class="card">
        <h2 id="ongoingCount">0</h2>
        <p>Đang trong quá trình khám</p>
      </div>
      <div class="card">
        <h2 id="completedCount">0</h2>
        <p>Đã hoàn thành khám bệnh</p>
      </div>
    </div>

    <!-- Tổng thu nhập -->
    <div class="income-card">
      <h2>Tổng thu nhập</h2>
      <p id="totalEarnings">0 VNĐ</p>
    </div>

    <!-- Biểu đồ doanh thu -->
    <!-- <div class="chart-container">
      <h2>Biểu đồ Doanh thu theo tháng</h2>
      <canvas id="earningsChart" width="400" height="400"></canvas>
    </div> -->

    <!-- Bộ lọc thời gian -->
    <div class="filter-section">
      <label for="timeFilter">Lọc theo:</label>
      <select id="timeFilter">
        <option value="all">Tất cả</option>
        <option value="month">Tháng này</option>
        <option value="year">Năm nay</option>
      </select>
    </div>

    <!-- Danh sách giao dịch -->
    <div class="transactions-section">
      <h2>Giao dịch gần đây</h2>
      <table class="transactions-table">
        <thead>
          <tr>
            <th>Ngày thanh toán</th>
            <th>Số tiền</th>
            <th>Phương thức</th>
          </tr>
        </thead>
        <tbody id="transactionList">
          <!-- Các giao dịch sẽ được thêm bằng JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
  <script src="../JS/earnings-expert.js"></script>
</body>
</html>
