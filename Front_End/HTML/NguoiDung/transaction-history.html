<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Giao Dịch</title>
    <link rel="stylesheet" href="../../CSS/NguoiDung/transaction-history.css">
</head>
<body>

<div class="transaction-history-container">
    <div class="header">
        <h2>Lịch Sử Giao Dịch</h2>
        <button class="btn-add-transaction" onclick="showTransactionForm()">Thêm Giao Dịch</button>
    </div>

    <!-- Transaction List -->
    <div id="transactionList" class="transaction-list">
        <!-- Các giao dịch sẽ được hiển thị ở đây -->
    </div>
</div>

<!-- Thêm Giao Dịch Form -->
<div id="addTransactionForm" class="add-transaction-form">
    <div class="form-container">
        <button class="close-form" onclick="closeTransactionForm()">X</button>
        <h3>Thêm Giao Dịch</h3>
        <form id="transactionForm">
            <label for="transactionTitle">Tiêu Đề:</label>
            <input type="text" id="transactionTitle" required>

            <label for="transactionDescription">Mô Tả:</label>
            <textarea id="transactionDescription" required></textarea>

            <label for="transactionAmount">Số Tiền:</label>
            <input type="number" id="transactionAmount" required>

            <label for="transactionDate">Ngày:</label>
            <input type="date" id="transactionDate" required>

            <button type="submit">Lưu Giao Dịch</button>
        </form>
    </div>
</div>

<script src="../../JS/NguoiDung/transaction-history.js"></script>
</body>
</html>
