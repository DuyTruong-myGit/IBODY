<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lịch tư vấn</title>
  <link rel="stylesheet" href="../../CSS/NguoiDung/payment-methods.css">
</head>
<body>
  <div class="payment-method-container">
    <h2>Đặt lịch tư vấn</h2>
    <div class="payment-wrapper">
      <!-- Panel trái -->
      <div class="left-panel">
        <h3>Thông tin người dùng</h3>
        <form id="bookingForm">
          <label for="fullName">Họ tên:</label>
          <input type="text" id="fullName" required>

          <label for="phone">Số điện thoại:</label>
          <input type="tel" id="phone" required>

          <label for="email">Email:</label>
          <input type="email" id="email" required>

          <label for="bookingTime">Chọn thời gian bắt đầu:</label>
          <input type="datetime-local" id="bookingTime" required>

          <label for="duration">Chọn gói thời lượng:</label>
          <select id="duration" required>
            <option value="">-- Chọn gói --</option>
            <option value="60">1 giờ</option>
            <option value="90">1 giờ 30 phút</option>
            <option value="120">2 giờ</option>
            <option value="180">3 giờ</option>
          </select>

          <label for="hinhThucId">Hình thức tư vấn:</label>
          <select id="hinhThucId" required>
            <option value="">-- Chọn hình thức --</option>
            <!-- JS sẽ load từ API -->
          </select>

          <label for="notes">Ghi chú (nếu có):</label>
          <textarea id="notes"></textarea>

          <div class="payment-confirm">
            <button type="submit" class="btn-primary">Gửi yêu cầu đặt lịch</button>
          </div>
        </form>
      </div>

      <!-- Panel phải -->
      <div class="right-panel">
        <h3>Thông tin chuyên gia và gói khám</h3>
        <div class="info-card"></div>
        <div class="info-card"></div>
      </div>
    </div>
  </div>

  <script src="../../JS/NguoiDung/datLich.js"></script>
</body>
</html>
