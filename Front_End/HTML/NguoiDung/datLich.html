<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lịch tư vấn</title>
  <link rel="stylesheet" href="../../CSS/NguoiDung/datLich.css">
</head>
<body>
  <div class="container">
    <h2>Đặt lịch tư vấn với chuyên gia</h2>

    <div class="info-card" id="userInfoCard">
      <h4>Thông tin người dùng</h4>
      <p><strong>Họ tên:</strong> <input type="text" id="fullName" disabled></p>
      <p><strong>Email:</strong> <input type="email" id="email" disabled></p>
      <p><strong>SĐT:</strong> <input type="text" id="phone" disabled></p>
    </div>

    <div class="info-card" id="expertInfoCard">
      <h4>Thông tin chuyên gia</h4>
      <p id="expertName"></p>
      <p id="expertChuyenMon"></p>
      <p id="expertDanhGia"></p>
      <p id="expertGioiThieu"></p>
    </div>

<form id="bookingForm">

      <label for="ngay">Chọn ngày:</label>
      <input type="date" id="ngay" required>

      <label for="slot">Chọn khung giờ trống:</label>
      <div id="slotContainer"></div>

      <label for="hinhThucId">Hình thức tư vấn:</label>
      <select id="hinhThucId" required></select>

      <label for="soCa">Số ca liên tiếp:</label>
      <select id="soCa">
        <option value="1">1 ca</option>
        <option value="2">2 ca</option>
        <option value="3">3 ca</option>
      </select>

      <label for="notes">Tóm tắt nội dung:</label>
      <textarea id="notes" rows="3" required></textarea>

      <button type="submit">Đặt lịch</button>
    </form>
  </div>

  <script src="../../JS/NguoiDung/datLich.js"></script>
</body>
</html>
