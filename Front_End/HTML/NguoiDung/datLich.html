  <link rel="stylesheet" href="../../CSS/index.css">
</head>
<body>

  <header class="header">
    <div class="logo">
      <span class="symbol">♂♀</span>
      <span class="brand">ibody</span>
    </div>
    
    <button id="menu-toggle" class="menu-toggle">☰</button>
  
      <nav class="nav">
      <a href="../Index.html" class="active">Trang chủ</a>
      <a href="https://www.facebook.com/groups/1717452315821331">Cộng Đồng</a>
      <a href="search-expert.html">Tư vấn</a>
      <a href="tin-nhan-user.html">Nhắn tin</a>
      <a href="lich-hen-user.html">Lịch hẹn</a>
      <a href="lichSuGoi.html">Lịch sử giao dịch</a>
      <a href="dang-ky-goi.html">Gói tư vấn</a>


      <a href="#" id="loginLink" onclick="openAuthModal()">Đăng nhập/Đăng ký</a>
      <div class="user-menu" id="userMenu" style="display: none;">
        <div class="user-button" onclick="toggleUserDropdown()">
          <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar" class="avatar">
          <span id="usernameDisplay"></span>
        </div>
        <div class="user-dropdown" id="userDropdown">
          <a href="../profile.html">Trang cá nhân</a>
          <a href="settings-upgrade.html">Nâng cấp thành chuyên gia</a>
          <a href="../../HTML/tracnghiem.html">Trắc nghiệm trầm cảm</a>

          <a href="#" onclick="logout()">Đăng xuất</a>
        </div>
      </div>
      
    </nav>

  </header>


  <div class="container">
    <h2>Đặt lịch tư vấn với chuyên gia</h2>

    <div class="info-card" id="userInfoCard">
      <h4>Thông tin người dùng</h4>
      <p><strong>Họ tên:</strong> <input type="text" id="fullName" disabled></p>
      <p><strong>Email:</strong> <input type="email" id="email" disabled></p>
      <p><strong>SĐT:</strong> <input type="text" id="phone" disabled></p>
    </div>

    <div class="info-card" id="expertInfoCard">
      <h4>Thông tin chuyên gia</h4>
      <p id="expertName"></p>
      <p id="expertChuyenMon"></p>
      <p id="expertDanhGia"></p>
      <p id="expertGioiThieu"></p>
    </div>

<form id="bookingForm">

      <label for="ngay">Chọn ngày:</label>
      <input type="date" id="ngay" required>

      <label for="slot">Chọn khung giờ trống:</label>
      <div id="slotContainer"></div>

      <label for="hinhThucId">Hình thức tư vấn:</label>
      <select id="hinhThucId" required></select>

      <label for="soCa">Số ca liên tiếp:</label>
      <select id="soCa">
        <option value="1">1 ca</option>
        <option value="2">2 ca</option>
        <option value="3">3 ca</option>
      </select>

      <label for="notes">Tóm tắt nội dung:</label>
      <textarea id="notes" rows="3" required></textarea>

      <button type="submit">Đặt lịch</button>
    </form>
  </div>

  <script src="../../JS/NguoiDung/datLich.js"></script>
</body>
</html>
